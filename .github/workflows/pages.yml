name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test the site
        shell: bash
        run: |
          set -euo pipefail
          python Artheureux/scripts/validate_download_manifest.py
          # Tests (dont la génération de la page) : node --test, puis génération finale dans site/
          npm test
          python scripts/bundle.py

          forbidden_files="$(find site -type f \( \
            -name 'original.pdf' -o \
            -name '*.docx' -o \
            -name 'V3 art heureux rapide.pdf' -o \
            -name 'V1 art heureux rapide.docx' \
          \) -print)"
          if [[ -n "$forbidden_files" ]]; then
            echo "Forbidden files found in site:"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
